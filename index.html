<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Loom · 像素动画编辑器</title>
<style>
:root{--bg:#11131a;--panel:#191c26;--line:#303545;--text:#edf1ff;--muted:#8d95ad;--accent:#77e1ba;--pink:#ff7aa8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#252a3e,#11131a 42%);color:var(--text);font:14px Inter,system-ui,sans-serif}button,input{font:inherit}button{border:1px solid var(--line);background:#202433;color:var(--text);padding:8px 11px;border-radius:8px;cursor:pointer}button:hover{border-color:var(--accent);color:var(--accent)}.app{max-width:1400px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{display:flex;gap:12px;align-items:center}.mark{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),#6a8cff);border-radius:10px;display:grid;place-items:center;color:#10151a;font-weight:800}.brand h1{font-size:20px;margin:0}.brand small{color:var(--muted)}.actions{display:flex;gap:8px}.primary{background:var(--accent);color:#10231e;border-color:var(--accent);font-weight:700}.workspace{display:grid;grid-template-columns:230px minmax(450px,1fr) 250px;gap:16px}.panel{background:rgba(25,28,38,.94);border:1px solid var(--line);border-radius:14px;padding:15px}.panel h3{margin:0 0 14px;font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted)}.toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool.active{border-color:var(--pink);color:var(--pink);background:#302333}.swatches{display:flex;flex-wrap:wrap;gap:9px}.sw{width:26px;height:26px;border-radius:7px;border:2px solid transparent;cursor:pointer}.sw.sel{border-color:white;box-shadow:0 0 0 2px var(--accent)}.range{width:100%;accent-color:var(--accent)}.center{display:flex;flex-direction:column;gap:12px;min-width:0}.canvasbox{background:#0c0e14;border:1px solid var(--line);border-radius:14px;padding:30px;display:grid;place-items:center;min-height:510px;position:relative}.canvaswrap{position:relative;image-rendering:pixelated;box-shadow:0 0 0 1px #3a4053,0 18px 60px #0008}.canvaswrap:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff11 1px,transparent 1px),linear-gradient(90deg,#ffffff11 1px,transparent 1px);background-size:calc(100% / 16) calc(100% / 16);pointer-events:none}.canvas{display:block;image-rendering:pixelated;background:#252a3a}.onion{position:absolute;inset:0;opacity:.23;pointer-events:none}.timeline{display:flex;align-items:center;gap:9px;overflow:auto;padding:4px}.frames{display:flex;gap:8px;overflow:auto}.frame{min-width:70px;height:70px;background:#10131c;border:1px solid var(--line);border-radius:9px;padding:5px;cursor:pointer}.frame.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.frame canvas{width:100%;height:100%;image-rendering:pixelated}.layer{display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid transparent;border-radius:8px;cursor:pointer}.layer.active{background:#252a39;border-color:var(--accent)}.layer span{color:var(--muted);font-size:12px}.field{display:flex;justify-content:space-between;align-items:center;color:var(--muted);margin:11px 0}.field input[type=text],.field select{width:120px;background:#10131b;border:1px solid var(--line);color:var(--text);padding:7px;border-radius:7px}.hint{color:var(--muted);font-size:12px;line-height:1.5}.status{font-size:12px;color:var(--accent);min-height:18px}.kbd{border:1px solid var(--line);padding:2px 6px;border-radius:5px;color:var(--muted)}@media(max-width:1000px){.workspace{grid-template-columns:190px 1fr}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:16px}}@media(max-width:700px){.app{padding:14px}.workspace{grid-template-columns:1fr}.left,.right{display:block}.canvasbox{min-height:360px;padding:15px}.actions button span{display:none}}
</style></head><body><main class="app"><header class="top"><div class="brand"><div class="mark">P</div><div><h1>Pixel Loom</h1><small>帧动画工作台 · 本地项目</small></div></div><div class="actions"><button id="undo">↶ 撤销</button><button id="redo">↷ 重做</button><button id="save" class="primary">保存项目</button><button id="export">导出 PNG</button></div></header>
<section class="workspace"><aside class="panel left"><h3>工具</h3><div class="toolgrid"><button class="tool active" data-tool="pencil">✦ 画笔</button><button class="tool" data-tool="eraser">⌫ 橡皮</button><button class="tool" data-tool="fill">◩ 填充</button><button class="tool" data-tool="picker">◉ 取色</button></div><h3 style="margin-top:25px">颜色</h3><div class="swatches" id="swatches"></div><input id="custom" type="color" value="#ff7aa8" style="width:100%;height:36px;margin-top:12px;background:#10131b;border:1px solid var(--line);border-radius:8px"><h3 style="margin-top:25px">画布</h3><div class="field"><label>缩放</label><input id="zoom" class="range" type="range" min="8" max="28" value="20"></div><div class="field"><label>网格</label><input id="grid" type="checkbox" checked></div><p class="hint">点击像素绘制，按住拖动连续涂色。支持 ⌘/Ctrl + Z。</p></aside>
<section class="center"><div class="canvasbox"><div class="canvaswrap" id="canvaswrap"><canvas id="onion" class="onion" width="320" height="320"></canvas><canvas id="canvas" class="canvas" width="320" height="320"></canvas></div></div><div class="panel timeline"><button id="addFrame" class="primary">＋ 新建帧</button><button id="duplicate">复制</button><div class="frames" id="frames"></div><label style="margin-left:auto;color:var(--muted);white-space:nowrap">FPS <input id="fps" type="number" min="1" max="24" value="8" style="width:45px;background:#10131b;border:1px solid var(--line);color:white;padding:5px;border-radius:6px"></label></div><div class="status" id="status"></div></section>
<aside class="panel right"><h3>图层</h3><div id="layers"><div class="layer active"><b>主图层</b><span>可见</span></div><div class="layer"><b>阴影</b><span>可见</span></div></div><button id="addLayer" style="width:100%;margin-top:10px">＋ 添加图层</button><h3 style="margin-top:25px">洋葱皮</h3><div class="field"><label>显示前一帧</label><input id="onionToggle" type="checkbox"></div><div class="field"><label>透明度</label><input id="opacity" class="range" type="range" min="5" max="60" value="23"></div><h3 style="margin-top:25px">播放预览</h3><button id="play" class="primary" style="width:100%">▶ 播放动画</button><p class="hint" style="margin-top:10px">项目会自动保存至浏览器本地存储。</p></aside></section></main>
<script>
const N=16, colors=['#ff7aa8','#77e1ba','#ffd166','#6a8cff','#b18cff','#ffffff','#11131a','#f97316'];let frames=[Array(N*N).fill('')],current=0,history=[],future=[],tool='pencil',color=colors[0],drawing=false;
const c=document.querySelector('#canvas'),ctx=c.getContext('2d'),oc=document.querySelector('#onion'),octx=oc.getContext('2d');function snap(){return frames.map(f=>f.slice())}function push(){history.push(snap());if(history.length>30)history.shift();future=[]}function draw(){ctx.clearRect(0,0,320,320);ctx.fillStyle='#202433';ctx.fillRect(0,0,320,320);let s=20;frames[current].forEach((v,i)=>{if(v){ctx.fillStyle=v;ctx.fillRect(i%N*s,Math.floor(i/N)*s,s,s)}});octx.clearRect(0,0,320,320);if(document.querySelector('#onionToggle').checked&&current>0){frames[current-1].forEach((v,i)=>{if(v){octx.fillStyle=v;octx.fillRect(i%N*s,Math.floor(i/N)*s,s,s)}})}renderFrames()}function renderFrames(){let el=document.querySelector('#frames');el.innerHTML='';frames.forEach((f,i)=>{let b=document.createElement('div');b.className='frame '+(i===current?'active':'');let x=document.createElement('canvas');x.width=x.height=N;let q=x.getContext('2d');q.fillStyle='#202433';q.fillRect(0,0,N,N);f.forEach((v,j)=>{if(v){q.fillStyle=v;q.fillRect(j%N,Math.floor(j/N),1,1)}});b.append(x);b.onclick=()=>{current=i;draw()};el.append(b)})}function setPixel(e){let r=c.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*N),y=Math.floor((e.clientY-r.top)/r.height*N),i=y*N+x;if(x<0||x>=N||y<0||y>=N)return;if(tool==='picker'){if(frames[current][i]){color=frames[current][i];document.querySelector('#custom').value=color}return}if(!drawing)push();frames[current][i]=tool==='eraser'?'':color;draw()}c.addEventListener('pointerdown',e=>{drawing=true;setPixel(e)});c.addEventListener('pointermove',e=>{if(drawing)setPixel(e)});window.addEventListener('pointerup',()=>drawing=false);document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.querySelector('#swatches').innerHTML=colors.map(x=>`<button class="sw" style="background:${x}" data-c="${x}"></button>`).join('');document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{color=b.dataset.c;document.querySelector('#custom').value=color});document.querySelector('#custom').oninput=e=>color=e.target.value;document.querySelector('#zoom').oninput=e=>{c.style.width=c.style.height=e.target.value*16+'px';oc.style.width=oc.style.height=e.target.value*16+'px';document.querySelector('#canvaswrap').style.width=document.querySelector('#canvaswrap').style.height=e.target.value*16+'px'};document.querySelector('#grid').onchange=e=>document.querySelector('#canvaswrap').classList.toggle('nogrid',!e.target.checked);document.querySelector('#opacity').oninput=e=>oc.style.opacity=e.target.value/100;document.querySelector('#onionToggle').onchange=draw;document.querySelector('#addFrame').onclick=()=>{push();frames.push(Array(N*N).fill(''));current=frames.length-1;draw()};document.querySelector('#duplicate').onclick=()=>{push();frames.splice(current+1,0,frames[current].slice());current++;draw()};document.querySelector('#addLayer').onclick=()=>{let n=document.querySelectorAll('.layer').length+1,d=document.createElement('div');d.className='layer';d.innerHTML=`<b>图层 ${n}</b><span>可见</span>`;document.querySelector('#layers').append(d)};document.querySelector('#undo').onclick=()=>{if(history.length){future.push(snap());frames=history.pop();current=Math.min(current,frames.length-1);draw()}};document.querySelector('#redo').onclick=()=>{if(future.length){history.push(snap());frames=future.pop();draw()}};document.querySelector('#save').onclick=()=>{localStorage.pixelLoom=JSON.stringify({frames,fps:document.querySelector('#fps').value});document.querySelector('#status').textContent='已保存到本地 · '+new Date().toLocaleTimeString()};document.querySelector('#export').onclick=()=>{let a=document.createElement('a');a.download='pixel-loom-frame.png';a.href=c.toDataURL('image/png');a.click();document.querySelector('#status').textContent='已导出当前帧 PNG'};document.querySelector('#play').onclick=()=>{let i=0;document.querySelector('#play').textContent='■ 停止预览';let t=setInterval(()=>{current=i++%frames.length;draw()},1000/(+document.querySelector('#fps').value||8));document.querySelector('#play').onclick=()=>{clearInterval(t);document.querySelector('#play').textContent='▶ 播放动画'}};if(localStorage.pixelLoom){try{let d=JSON.parse(localStorage.pixelLoom);frames=d.frames||frames;document.querySelector('#fps').value=d.fps||8}catch(e){}}document.querySelector('#zoom').dispatchEvent(new Event('input'));draw();
</script></body></html>
