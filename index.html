<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Loom · 像素动画脚本工作台</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand">
      <div class="mark">P</div>
      <div>
        <h1>Pixel Loom</h1>
        <small>像素动画脚本工作台 · 纯本地运行</small>
      </div>
    </div>
    <div class="actions">
      <button id="undoBtn" type="button" title="Ctrl+Z">↶ 撤销</button>
      <button id="redoBtn" type="button" title="Ctrl+Y">↷ 重做</button>
      <button id="saveBtn" type="button" class="primary" title="Ctrl+S">保存</button>
      <button id="importBtn" type="button">导入</button>
      <button id="exportBtn" type="button">导出</button>
      <button id="newBtn" type="button">新建</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </div>
  </header>

  <section class="workspace">
    <aside class="panel left">
      <h3>工具</h3>
      <div class="toolgrid">
        <button type="button" class="tool active" data-tool="brush" title="快捷键 B">✦ 画笔</button>
        <button type="button" class="tool" data-tool="fill" title="快捷键 F">◩ 填充</button>
        <button type="button" class="tool" data-tool="move" title="快捷键 M">➚ 选区移动</button>
        <button type="button" class="tool" data-tool="eraser" title="快捷键 E">⌫ 橡皮</button>
        <button type="button" class="tool" data-tool="picker" title="快捷键 I">◉ 取色</button>
      </div>

      <h3>颜色</h3>
      <div class="swatches" id="swatches"></div>
      <input id="customColor" type="color" value="#ff7aa8" aria-label="自定义颜色">

      <h3>画布</h3>
      <div class="fldrow"><label for="zoomRange">缩放</label><input id="zoomRange" type="range" min="10" max="30" value="20"></div>
      <div class="fldrow"><label for="gridToggle">网格</label><input id="gridToggle" type="checkbox" checked></div>

      <h3>键盘</h3>
      <p class="hint">
        <span class="kbd">B</span>/<span class="kbd">F</span>/<span class="kbd">M</span>/<span class="kbd">E</span>/<span class="kbd">I</span> 切换工具，
        方向键移动光标，<span class="kbd">Enter</span> 在光标处作画，
        <span class="kbd">[</span> <span class="kbd">]</span> 切换帧，
        <span class="kbd">R</span> 录制，<span class="kbd">P</span> 预览，
        <span class="kbd">Ctrl+Z</span> 撤销，<span class="kbd">Ctrl+S</span> 保存，
        <span class="kbd">Esc</span> 取消选区。
      </p>
    </aside>

    <section class="center">
      <div class="canvasbox">
        <canvas id="canvas" width="320" height="320" tabindex="0" aria-label="像素画布"></canvas>
      </div>
      <div class="panel timeline">
        <button id="addFrameBtn" type="button" class="primary">＋ 新建帧</button>
        <button id="dupFrameBtn" type="button">复制帧</button>
        <button id="delFrameBtn" type="button">删除帧</button>
        <div class="frames" id="frames" role="listbox" aria-label="帧列表"></div>
        <span id="frameInfo" class="frameinfo">帧 1 / 1</span>
      </div>
      <div id="status" class="status ok" role="status" aria-live="polite"></div>
    </section>

    <aside class="panel right">
      <h3>脚本</h3>
      <div class="row">
        <select id="scriptSelect" aria-label="选择脚本"></select>
        <button id="scriptNew" type="button">新建</button>
        <button id="scriptRename" type="button">重命名</button>
        <button id="scriptDelete" type="button">删除</button>
      </div>

      <h3>帧范围与重放</h3>
      <div class="row">
        <label class="inline">起 <input id="rangeStart" type="number" min="1" value="1"></label>
        <label class="inline">止 <input id="rangeEnd" type="number" min="1" value="1"></label>
        <select id="playMode" aria-label="重放方式">
          <option value="forward">正向</option>
          <option value="reverse">反向</option>
          <option value="mirror">镜像</option>
        </select>
      </div>

      <h3>步骤</h3>
      <div class="row">
        <button id="recordBtn" type="button" class="record">○ 开始录制</button>
      </div>
      <div class="row">
        <select id="addStepType" aria-label="步骤类型">
          <option value="brush">画笔</option>
          <option value="fill">填充</option>
          <option value="move">选区移动</option>
          <option value="script">子脚本（嵌套）</option>
        </select>
        <button id="addStepBtn" type="button">＋ 添加步骤</button>
      </div>
      <div id="stepsList" class="steps"></div>

      <h3>批量应用</h3>
      <div class="row">
        <button id="previewBtn" type="button" title="快捷键 P">逐帧预览</button>
        <button id="applyBtn" type="button" class="primary">批量应用</button>
      </div>
      <div id="previewStrip" class="preview" aria-label="逐帧预览"></div>
      <p class="hint">批量应用只占 1 次撤销；任一步骤失败，整批自动回滚。</p>
    </aside>
  </section>
</main>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
